name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Show toolchain
        run: swift --version
      - name: Build
        run: swift build -c release
      # The suite is a plain executable, so it needs no Xcode test host and no
      # Accessibility grant — it covers the pure logic (coordinate conversion,
      # snapshot rendering, session handling, error contracts). The parts that
      # require a real UI session are verified by `amcu doctor` on a machine
      # with permissions granted.
      - name: Test
        run: swift run -c release amcu-tests
      # The release workflow ships whatever this produces; building it here too
      # means a packaging break shows up on the pull request, not on tag day.
      - name: Package
        run: Scripts/package.sh
      # The extension is plain JavaScript with no build step; a syntax check
      # catches the mistakes the Swift suite cannot see.
      - name: Check skill is in sync
        run: .build/release/amcu skill | diff - skills/amcu/SKILL.md
      - name: Check extension
        run: |
          for f in extension/*.js safari/extension/*.js; do node --check "$f"; done
          python3 Scripts/embed-extension.py && git diff --exit-code -- Sources/AmcuCore/ExtensionBundle.swift Sources/AmcuCore/SafariExtensionBundle.swift
